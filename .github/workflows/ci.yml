name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Отримати код репозиторію
      uses: actions/checkout@v4
    - name: "Eco CI: початок"
      uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
      with:
        task: start-measurement
        send-data: false
        co2-calculation-method: constant
        co2-grid-intensity-constant: 458
    - name: Налаштувати Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Встановити залежності (крок "збірки")
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Запустити тести
      run: pytest -v
    - name: "Eco CI: вимір build-and-test"
      if: always()
      uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
      with:
        task: get-measurement
        label: build-and-test
    - name: "Eco CI: підсумок"
      if: always()
      uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
      with:
        task: display-results
        send-data: false
        display-badge: false

  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4
      - name: "Eco CI: початок"
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: start-measurement
          send-data: false
          co2-calculation-method: constant
          co2-grid-intensity-constant: 458
      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin
      - name: Зібрати Docker-образ (крок "Package")
        run: |
          IMAGE=ghcr.io/korniienkomaksym/ci-lab-app
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
      - name: Завантажити образ у реєстр
        run: |
          IMAGE=ghcr.io/korniienkomaksym/ci-lab-app
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker tag $IMAGE:latest $IMAGE:v1.0.0
          docker push $IMAGE:v1.0.0
      - name: "Eco CI: вимір build-and-push-image"
        if: always()
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: build-and-push-image
      - name: "Eco CI: підсумок"
        if: always()
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: display-results
          send-data: false
          display-badge: false

  deploy:
    needs: build-and-push-image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4
      - name: "Eco CI: початок"
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: start-measurement
          send-data: false
          co2-calculation-method: constant
          co2-grid-intensity-constant: 458
      - name: Встановити Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.*"
      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin
      - name: Перевірка форматування Terraform
        working-directory: infra
        run: terraform fmt -check
      - name: terraform init
        working-directory: infra
        run: terraform init
      - name: terraform apply
        working-directory: infra
        run: |
          IMAGE="ghcr.io/korniienkomaksym"
          IMAGE="$IMAGE/ci-lab-app:${{ github.sha }}"
          terraform apply -auto-approve -var="image_name=$IMAGE"
      - name: Перевірити результат розгортання (smoke-test)
        run: |
          docker logs ci-lab-deploy
          EXIT_CODE=$(docker inspect ci-lab-deploy --format='{{.State.ExitCode}}')
          echo "Код завершення контейнера: $EXIT_CODE"
          test "$EXIT_CODE" -eq 0
      - name: terraform destroy
        if: always()
        working-directory: infra
        run: |
          IMAGE="ghcr.io/korniienkomaksym"
          IMAGE="$IMAGE/ci-lab-app:${{ github.sha }}"
          terraform destroy -auto-approve -var="image_name=$IMAGE"
      - name: "Eco CI: вимір deploy"
        if: always()
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: get-measurement
          label: deploy
      - name: "Eco CI: підсумок"
        if: always()
        uses: green-coding-solutions/eco-ci-energy-estimation@v5.3.0
        with:
          task: display-results
          send-data: false
          display-badge: false