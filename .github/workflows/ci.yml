name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Отримати код репозиторію
      uses: actions/checkout@v4
    - name: Налаштувати Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Встановити залежності (крок "збірки")
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Запустити тести
      run: pytest -v