name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Отримати код репозиторію
      uses: actions/checkout@v4
    - name: Налаштувати Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Встановити залежності (крок "збірки")
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Запустити тести
      run: pytest -v

  build-and-push-image:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Отримати код репозиторію
        uses: actions/checkout@v4
      - name: Увійти в GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u ${{ github.actor }} --password-stdin
      - name: Зібрати Docker-образ (крок "Package")
        run: |
          IMAGE=ghcr.io/korniienkomaksym/ci-lab-app
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
      - name: Завантажити образ у реєстр
        run: |
          IMAGE=ghcr.io/korniienkomaksym/ci-lab-app
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          docker tag $IMAGE:latest $IMAGE:v1.0.0
          docker push $IMAGE:v1.0.0
